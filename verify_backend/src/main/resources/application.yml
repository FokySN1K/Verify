server:
  port: ${SERVER_PORT:8080}

spring:

  application:
    name: verify_backend

  jdbc:
    template:
      query-timeout: 30000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/verify}
    username: ${DB_USERNAME:verify}
    password: ${DB_PASSWORD:verify}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      pool-name: verify_pool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  servlet:
    multipart:
      enabled: true
      location: ${UPLOAD_DIR:${user.dir}/tmp/uploads}
      file-size-threshold: 10MB
      max-file-size: 50MB
      resolve-lazily: false

  mail:
    host: ${MAIL_HOST:smtp.mail.ru}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:test@test.ru}
    password: ${MAIL_PASSWORD:test}
    protocol: ${MAIL_PROTOCOL:smtp}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: ${MAIL_PORT:465}
            class: javax.net.ssl.SSLSocketFactory

logging:
  level:
    root: INFO
    org.springframework.jdbc.core.JdbcTemplate: INFO
    org.springframework.jdbc.core.StatementCreatorUtils: WARN
    org.springframework.jdbc.datasource.DataSourceTransactionManager: INFO
    com.example.verify_backend.Repository: INFO
